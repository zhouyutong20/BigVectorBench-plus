name: BigVectorBench-Run

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel the workflow for the previous commit when the new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: True

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libhdf5-dev python3-numpy python3-scipy python3-matplotlib python3-sklearn
      - run: pip3 install --quiet -r requirements.txt
      - run: python -m pytest

  # The third-party Docker benchmark matrix is expensive and depends on
  # external services/images. Keep it available for manual validation without
  # making every code/data push depend on those external backends.
  run-benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: [random-xs-32-euclidean, random-xs-32-euclidean-2filter]
        library:
          - bruteforce
          - dummy_algo
          - milvus
          - qdrant
          - weaviate
          - redis
          - elasticsearch
          - sptag
          - pgvector
          # - vearch # Vearch test is disabled temporarily due to disk space constraints.
          # GPU support is not available in the free tier
          # - milvus_gpu
          # - vearch_gpu

    name: ${{ matrix.library }} (${{ matrix.dataset }})

    env:
      LIBRARY: ${{ matrix.library }}
      DATASET: ${{ matrix.dataset }}

    steps:
    - uses: actions/checkout@v5

    - name: Install OS Dependencies
      run: sudo apt-get update && sudo apt-get install -y libhdf5-dev python3-numpy python3-scipy python3-matplotlib python3-sklearn

    - name: Install Project Dependencies
      run: pip3 install --quiet -r requirements.txt

    - name: Build Library Docker Image
      run: python3 install.py --algorithm ${LIBRARY}

    - name: Run the benchmark
      run: |
        python3 run.py --docker-tag bigvectorbench-${LIBRARY} --max-n-algorithms 2 --runs 1 --dataset ${DATASET} --run-disabled --timeout 300
        sudo chmod -R 777 results/
        python3 plot.py --dataset ${DATASET} --output plot.png
        python3 data_export.py --out test.csv

    - name: Collect Docker diagnostics
      if: always()
      run: |
        mkdir -p ci-diagnostics
        docker ps -a > ci-diagnostics/docker-ps.txt 2>&1 || true
        docker images --no-trunc > ci-diagnostics/docker-images.txt 2>&1 || true
        for container_id in $(docker ps -aq); do
          container_name=$(docker inspect --format '{{.Name}}' "${container_id}" 2>/dev/null || true)
          echo "===== ${container_name} (${container_id}) ====="
          docker logs "${container_id}" 2>&1 || true
        done > ci-diagnostics/docker-logs.txt

    - name: Upload benchmark diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-diagnostics-${{ matrix.library }}-${{ matrix.dataset }}
        path: |
          ci-diagnostics/
          results/
          test.csv
          plot.png
        if-no-files-found: ignore
